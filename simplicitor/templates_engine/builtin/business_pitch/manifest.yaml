# Indices reconciled to the committed template.pptx (Charts template 16x9, sample slides stripped).
# If template.pptx is rebuilt, re-verify with scripts/inspect_template.py.
name: business_pitch
type: pptx
template_file: template.pptx
description: Business pitch deck with the Charts 16x9 design. Title, agenda, content, and closing slides.
slide_types:
  title:
    layout_index: 0          # Title Slide
    fields:
      - name: title
        placeholder_idx: 0
        kind: text
        required: true
        max_chars: 60
      - name: subtitle
        placeholder_idx: 1
        kind: text
        required: false
        max_chars: 120
  agenda:
    layout_index: 1          # Title and Content
    fields:
      - name: heading
        placeholder_idx: 0
        kind: text
        required: true
        max_chars: 40
      - name: items
        placeholder_idx: 1
        kind: bullets
        required: true
        max_items: 5
  content:
    layout_index: 1          # Title and Content
    fields:
      - name: heading
        placeholder_idx: 0
        kind: text
        required: true
        max_chars: 60
      - name: bullets
        placeholder_idx: 1
        kind: bullets
        required: false
        max_items: 6
  closing:
    layout_index: 3          # Section Header
    fields:
      - name: heading
        placeholder_idx: 0
        kind: text
        required: true
        max_chars: 60
      - name: statement
        placeholder_idx: 1
        kind: text
        required: true
        max_chars: 160
