name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-build.txt

      - name: Run source tests on hosted runner
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'simplicitor-tests'
          $env:APPDATA = Join-Path $env:USERPROFILE 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $env:USERPROFILE 'AppData/Local'
          python -m pytest -q --basetemp "$env:RUNNER_TEMP/simplicitor-pytest"

      - name: Generate icon
        run: python resources/create_icon.py

      - name: Build standalone, installer, and portable ZIP
        run: python build.py

      - name: Qualify installer on hosted Windows runner
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/qualify_windows_installer.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simplicitor-windows
          path: |
            dist/Simplicitor-setup.exe
            dist/Simplicitor-portable.zip
            dist/SHA256SUMS.json
            dist/installer-qualification.json
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Simplicitor-setup.exe
            dist/Simplicitor-portable.zip
            dist/SHA256SUMS.json
          fail_on_unmatched_files: true
