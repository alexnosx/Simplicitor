<script>
(() => {
  const root = document.getElementById('simplicitor-app-directions');
  const template = document.getElementById('sa-workspace-template');
  const apps = Array.from(root.querySelectorAll('.sa-app'));
  apps.forEach(app => {
    app.querySelector('[data-content]').appendChild(template.content.cloneNode(true));
    const note = app.querySelector('.sa-toast');
    function showNote(message) {
      note.textContent = message;
      note.hidden = false;
    }
    function setMode(mode) {
      app.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      app.querySelectorAll('[data-page]').forEach(page => { page.hidden = page.dataset.page !== mode; });
      note.hidden = true;
    }
    app.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
    app.querySelectorAll('[data-route]').forEach(button => button.addEventListener('click', () => {
      app.querySelectorAll('[data-route]').forEach(route => route.setAttribute('aria-pressed', String(route === button)));
      app.querySelectorAll('[data-view]').forEach(view => { view.hidden = view.dataset.view !== button.dataset.route; });
      note.hidden = true;
    }));
    const templateArea = app.querySelector('.sa-template-area');
    const templateSelect = app.querySelector('.sa-template-select');
    const templateChosen = app.querySelector('.sa-template-chosen');
    const templateButton = app.querySelector('[data-template]');
    function clearTemplate() {
      templateSelect.value = '';
      templateSelect.hidden = true;
      templateChosen.hidden = true;
      templateButton.hidden = false;
    }
    app.querySelectorAll('[data-format]').forEach(button => button.addEventListener('click', () => {
      app.querySelectorAll('[data-format]').forEach(format => format.setAttribute('aria-pressed', String(format === button)));
      templateArea.hidden = button.dataset.format !== 'PowerPoint';
      if (templateArea.hidden) clearTemplate();
      app.querySelector('.sa-create-action').textContent = `Create ${button.dataset.format} file →`;
      note.hidden = true;
    }));
    templateButton.addEventListener('click', () => { templateSelect.hidden = !templateSelect.hidden; });
    templateSelect.addEventListener('change', () => {
      if (!templateSelect.value) return;
      templateChosen.querySelector('span').textContent = 'Template: ' + templateSelect.value;
      templateChosen.hidden = false;
      templateSelect.hidden = true;
      templateButton.hidden = true;
    });
    app.querySelector('[data-clear-template]').addEventListener('click', clearTemplate);
    app.querySelectorAll('[data-preview-note]').forEach(button => button.addEventListener('click', () => showNote(button.dataset.previewNote)));
    app.querySelector('[data-settings]').addEventListener('click', () => showNote('Settings keeps the existing model and folder choices. This is a visual concept; no settings are changed.'));
    app.querySelectorAll('[data-remove-source]').forEach(button => button.addEventListener('click', () => showNote('This is a synthetic reading-state example. No file is attached or removed.')));
    setMode('create');
  });
  if (globalThis.lucide) lucide.createIcons({ attrs: { width: 17, height: 17 } });
})();
</script>
